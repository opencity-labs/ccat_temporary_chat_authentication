<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheshire Cat - Session Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        #chat {
            border: 1px solid #ccc;
            height: 400px;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 10px;
        }
        .message {
            margin: 10px 0;
            padding: 8px;
        }
        .user { text-align: right; }
        .cat { text-align: left; background: #f0f0f0; }
        .typing {
            color: #999;
            font-style: italic;
        }
        .sources-btn {
            margin-top: 5px;
            padding: 4px 8px;
            font-size: 12px;
            cursor: pointer;
        }
        .sources {
            margin-top: 5px;
            padding: 5px;
            background: #e0e0e0;
            font-size: 12px;
            display: none;
        }
        .sources.show { display: block; }
        .sources a {
            display: block;
            margin: 2px 0;
            color: #0066cc;
            text-decoration: none;
        }
        .sources a:hover { text-decoration: underline; }
        #input {
            width: 80%;
            padding: 8px;
        }
        button {
            padding: 8px 16px;
        }
        #status {
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>
    <h1>Cheshire Cat Chat</h1>
    <div id="status">Connecting...</div>
    <div id="chat"></div>
    <input type="text" id="input" placeholder="Type a message..." />
    <button onclick="send()">Send</button>

    <script>
        let socket, sessionId, token, typingIndicator;
        const chat = document.getElementById('chat');
        const input = document.getElementById('input');
        const status = document.getElementById('status');

        async function init() {
            const res = await fetch('http://localhost/custom/sessions/create', { method: 'POST' });
            //const res = await fetch('http://localhost:1865/custom/sessions/create', { method: 'POST' });
            //const res = await fetch('https://webinstance/custom/sessions/create', { method: 'POST' });
            const data = await res.json();
            sessionId = data.user_id;
            token = data.session_token;
            
            socket = new WebSocket(`ws://localhost${data.websocket_url}`);
            // socket = new WebSocket(`wss://webinstance${data.websocket_url}`);
            socket.onopen = () => status.textContent = 'Connected';
            socket.onmessage = (e) => {
                const msg = JSON.parse(e.data);
                if (msg.text) {
                    removeTyping();
                    addMessage(msg.text, 'cat', msg.sources);
                }
            };
            socket.onclose = () => status.textContent = 'Disconnected';
            socket.onerror = () => status.textContent = 'Error';
        }

        function showTyping() {
            removeTyping();
            typingIndicator = document.createElement('div');
            typingIndicator.className = 'message typing';
            typingIndicator.textContent = 'Typing...';
            chat.appendChild(typingIndicator);
            chat.scrollTop = chat.scrollHeight;
        }

        function removeTyping() {
            if (typingIndicator) {
                typingIndicator.remove();
                typingIndicator = null;
            }
        }

        function addMessage(text, type, sources = []) {
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.textContent = text;
            
            if (type === 'cat' && sources && sources.length > 0) {
                const btn = document.createElement('button');
                btn.className = 'sources-btn';
                btn.textContent = 'Sources';
                
                const srcDiv = document.createElement('div');
                srcDiv.className = 'sources';
                sources.forEach(s => {
                    const link = document.createElement('a');
                    link.href = s.url;
                    link.target = '_blank';
                    link.textContent = s.label || s.url;
                    srcDiv.appendChild(link);
                });
                
                btn.onclick = () => srcDiv.classList.toggle('show');
                div.appendChild(btn);
                div.appendChild(srcDiv);
            }
            
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function send() {
            const text = input.value.trim();
            if (text && socket.readyState === WebSocket.OPEN) {
                addMessage(text, 'user');
                socket.send(JSON.stringify({ text }));
                input.value = '';
                showTyping();
            }
        }

        input.onkeypress = (e) => { if (e.key === 'Enter') send(); };
        
        init();
    </script>
</body>
</html>
